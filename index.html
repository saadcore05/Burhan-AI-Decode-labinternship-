<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burhan — Rule-Based Assistant</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.2/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink:        #0E1016;
            --panel:      #171A24;
            --panel-2:    #1D2130;
            --border:     #2A2E3E;
            --brass:      #E3A73C;
            --brass-dim:  #8A6A2E;
            --slate:      #33465F;
            --slate-2:    #3E5573;
            --text:       #ECE7DA;
            --muted:      #838AA0;
            --danger:     #C9705A;
            --radius:     10px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--ink);
            color: var(--text);
            font-family: 'IBM Plex Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            background-image:
                radial-gradient(circle at 15% 0%, rgba(227, 167, 60, 0.06), transparent 45%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
        }

        .frame {
            width: 100%;
            max-width: 560px;
        }

        .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--brass);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .eyebrow::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--brass);
            box-shadow: 0 0 0 3px rgba(227,167,60,0.18);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 28px;
            letter-spacing: -0.01em;
            margin: 0 0 4px;
        }

        h1 span { color: var(--brass); }

        .subhead {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--muted);
            margin: 0 0 22px;
        }

        .console {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 24px 60px -20px rgba(0,0,0,0.6);
        }

        .console-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
        }

        .console-bar-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--muted);
        }

        .console-bar-status {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--brass);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .console-bar-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #6FCF7C;
            box-shadow: 0 0 0 3px rgba(111,207,124,0.18);
        }

        #chat-history {
            height: 420px;
            overflow-y: auto;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #chat-history::-webkit-scrollbar { width: 8px; }
        #chat-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
        #chat-history::-webkit-scrollbar-track { background: transparent; }

        .row { display: flex; width: 100%; }
        .row-user { justify-content: flex-end; }
        .row-bot { justify-content: flex-start; }

        .bubble {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 14.5px;
            line-height: 1.5;
            animation: rise 0.22s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .bubble-user {
            background: var(--slate);
            border: 1px solid var(--slate-2);
            border-bottom-right-radius: 3px;
            color: var(--text);
        }

        .bubble-bot {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 3px;
            color: var(--text);
        }

        .match-tag {
            margin-top: 8px;
            padding-top: 7px;
            border-top: 1px dashed var(--border);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 0.02em;
            color: var(--brass-dim);
        }

        .match-tag-none { color: var(--danger); }

        .bubble.typing {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 13px 16px;
        }

        .bubble.typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: blink 1.1s infinite ease-in-out;
        }

        .bubble.typing span:nth-child(2) { animation-delay: 0.15s; }
        .bubble.typing span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-2px); }
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 14px 16px;
            border-top: 1px solid var(--border);
            background: var(--panel);
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--ink);
            color: var(--text);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]::placeholder { color: var(--muted); }

        input[type="text"]:focus {
            border-color: var(--brass);
            box-shadow: 0 0 0 3px rgba(227,167,60,0.15);
        }

        button {
            padding: 12px 20px;
            background: var(--brass);
            color: #241A08;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: filter 0.15s, transform 0.05s;
        }

        button:hover { filter: brightness(1.08); }
        button:active { transform: scale(0.97); }
        button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

        .footnote {
            margin-top: 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 480px) {
            #chat-history { height: 62vh; }
            h1 { font-size: 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .bubble, .bubble.typing span { animation: none; }
        }
    </style>
</head>
<body>

    <div class="frame">
        <div class="eyebrow">Decodelabs Systems</div>
        <h1>Burhan<span>.</span></h1>
        <p class="subhead">rule-based pattern-matching assistant · built by Saad</p>

        <div class="console">
            <div class="console-bar">
                <div class="console-bar-title">session: local</div>
                <div class="console-bar-status"><span class="dot"></span>online</div>
            </div>

            <div id="chat-history"></div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type a message… try 'salam' or 'help'">
                <button id="send-btn">Send</button>
            </div>
        </div>

        <p class="footnote">no neural net — every reply is a matched keyword, shown below each response</p>
    </div>

    <script type="py" src="./burhan.py"></script>

</body>
</html>
